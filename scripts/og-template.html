<!doctype html>
<!--
  The dinnaga.ai share card, 1200x630, rendered to public/og.png by scripts/generate-og.ts.
  Darkroom spec (docs/superpowers/specs/2026-11-12-darkroom.md): warm ground, paper type, Archivo only.
  No red: red means "tested", and nothing on the card is a tested doc. The mark's paths must match
  src/components/BrandMark.tsx (src/test/og.test.ts checks it).
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Dinnaga Research share card</title>
  <style>
    @font-face {
      font-family: 'Archivo';
      src: url('../public/fonts/archivo-var.woff2') format('woff2');
      font-weight: 400 800;
      font-stretch: 62% 125%;
      font-display: block;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
    }

    body {
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: 64px 72px 60px;
      background: #0d0c0b;
      color: #ece4d3;
      font-family: 'Archivo', sans-serif;
      font-synthesis: none;
      -webkit-font-smoothing: antialiased;
    }

    /* Brand role (spec 4.4): wdth 75, 700, caps, 0.06em. */
    .brand {
      display: flex;
      align-items: center;
      gap: 18px;
      font-size: 28px;
      font-stretch: 75%;
      font-weight: 700;
      line-height: 1;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .brand svg {
      width: 44px;
      height: 44px;
      flex: none;
    }

    /* Display role (spec 4.4): wdth 125, 800, lh 0.95, -0.015em, sentence case. */
    h1 {
      align-self: end;
      max-width: 1056px;
      padding-bottom: 44px;
      font-size: 96px;
      font-stretch: 125%;
      font-weight: 800;
      line-height: 0.95;
      letter-spacing: -0.015em;
      text-wrap: balance;
    }

    /* Label role (spec 4.4): wdth 62, 600, label colour; no caps needed. */
    .domain {
      font-size: 30px;
      font-stretch: 62%;
      font-weight: 600;
      line-height: 1;
      letter-spacing: 0.02em;
      color: #a39b8c;
    }
  </style>
</head>
<body>
  <p class="brand">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none" aria-hidden="true">
      <path d="M20 2 L36 11 L36 29 L20 38 L4 29 L4 11 Z" stroke="#ece4d3" stroke-width="1.5" />
      <path d="M12 12 L12 28 L24 28 L28 24 L28 16 L24 12 Z M14 18 L24 18 L24 22 L14 22 Z" fill="#ece4d3" fill-rule="evenodd" />
    </svg>
    Dinnaga Research
  </p>
  <h1>Living documents for engineers who code with AI</h1>
  <p class="domain">dinnaga.ai</p>
</body>
</html>
