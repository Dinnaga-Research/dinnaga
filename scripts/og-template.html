<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dinnaga OG Card</title>
  <style>
    @font-face {
      font-family: 'Marathon Shapiro';
      src: url('../public/fonts/MarathonShapiroWide65.woff2') format('woff2');
      font-weight: 700;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 1200px;
      height: 630px;
      background: #0a0a0a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #fff;
    }

    .container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 60px;
    }

    .mark {
      width: 120px;
      height: 120px;
      flex-shrink: 0;
    }

    .mark svg {
      width: 100%;
      height: 100%;
      stroke: #d4ff00;
      color: #d4ff00;
    }

    .content {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 20px;
    }

    .wordmark {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .wordmark-text {
      font-family: 'Marathon Shapiro', Impact, sans-serif;
      font-size: 72px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #fff;
    }

    .domain {
      font-size: 32px;
      letter-spacing: 0.5px;
      color: #d4ff00;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="mark">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none">
        <path d="M20 2 L36 11 L36 29 L20 38 L4 29 L4 11 Z" stroke="currentColor" stroke-width="1.5" fill="none"></path>
        <path d="M12 12 L12 28 L24 28 L28 24 L28 16 L24 12 Z" fill="currentColor"></path>
        <rect x="14" y="18" width="10" height="4" fill="#000"></rect>
      </svg>
    </div>
    <div class="content">
      <div class="wordmark-text">DINNAGA</div>
      <div class="domain">dinnaga.ai</div>
    </div>
  </div>
</body>
</html>
